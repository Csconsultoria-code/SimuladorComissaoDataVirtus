<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Simulador Variável Data Virtus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap">
<style>
:root{--bg:#F5F1E8;--surface:#FFFDF9;--ink:#27313A;--ink-2:#56626B;--ink-3:#8A928F;--line:#E3DACA;--input:#F7F3EA;--accent:#4A6572;--warn:#9A5B2E;--shadow:0 1px 2px rgba(60,52,36,.04),0 10px 30px -8px rgba(60,52,36,.12)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#1B2024;--surface:#242B30;--ink:#ECE6D9;--ink-2:#B9B6AB;--ink-3:#8A918F;--line:#39434A;--input:#2A3237;--accent:#A9C0CA;--warn:#E0A77A;--shadow:0 12px 30px -10px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:20px}
form{width:100%;max-width:380px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:34px 30px;display:flex;flex-direction:column;gap:14px;text-align:center}
.eb{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
h1{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:26px;margin:0;line-height:1.2}
p{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.5}
input{font:inherit;font-size:15px;color:var(--ink);background:var(--input);border:1px solid transparent;border-radius:12px;padding:12px 14px;width:100%;margin-top:6px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;border:none;border-radius:999px;padding:12px;background:var(--ink);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--warn);font-size:13px;min-height:1.2em}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="eb">CS Consultoria · Data Virtus</div>
  <h1>Simulador de remuneração variável</h1>
  <p>Conteúdo restrito. Digite a senha de acesso.</p>
  <input type="password" id="pw" placeholder="Senha" aria-label="Senha" autofocus required>
  <button id="bt" type="submit">Entrar</button>
  <div id="err" role="alert"></div>
</form>

async function open_(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c));
  return new TextDecoder().decode(pt);
}
async function go(pw,remember){
  const html=await open_(pw);
  if(remember){try{sessionStorage.setItem("dv_pw",pw)}catch(e){}}
  document.open();document.write(html);document.close();
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const bt=document.getElementById("bt"),er=document.getElementById("err");
  bt.disabled=true;bt.textContent="Abrindo…";er.textContent="";
  try{await go(document.getElementById("pw").value,true)}

});
